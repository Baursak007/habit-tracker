name: Build and Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HabitTracker-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-APK
          path: build/app/outputs/flutter-apk/HabitTracker-v${{ github.run_number }}.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: HabitTracker-APK
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Трекер привычек v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Трекер привычек — Android APK

            ### ✨ Возможности:
            - ✅ Добавление, редактирование и удаление привычек
            - 📊 Статистика: серии, графики за 7 дней, рейтинг
            - 🎨 Тёмная и светлая тема
            - 📁 Категории: Здоровье, Спорт, Образование и др.
            - 🗓️ Ежедневные и еженедельные цели
            - 💾 Локальное хранение данных (SQLite)
            - 📤 Экспорт данных в CSV

            ### 📥 Установка:
            1. Скачай `HabitTracker-v${{ github.run_number }}.apk`
            2. На Android: Настройки → Безопасность → Разрешить установку из неизвестных источников
            3. Открой скачанный файл и установи

            Сборка #${{ github.run_number }}
          files: ./apk/HabitTracker-v${{ github.run_number }}.apk
          draft: false
          prerelease: false
